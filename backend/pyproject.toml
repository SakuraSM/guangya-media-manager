[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guangya-media-manager-api"
version = "0.1.0"
description = "Personal NAS media organizer for Guangya cloud drive"
requires-python = ">=3.12,<4"
dependencies = [
  "aiosqlite>=0.21.0",
  "asyncpg>=0.30.0",
  "cryptography>=44.0.0",
  "fastapi>=0.115.0",
  "greenlet>=3.1.0",
  "guangyapan>=0.0.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.7.0",
  "python-multipart>=0.0.20",
  "redis>=5.2.0",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
